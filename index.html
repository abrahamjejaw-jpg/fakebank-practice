
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FakeBank Auth Lab</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #eef2f7;
      color: #172033;
    }
    .card {
      max-width: 440px;
      margin: 45px auto;
      padding: 28px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 8px 28px #14213d18;
    }
    h1 { color: #087f5b; margin-top: 0; }
    p { line-height: 1.5; }
    label { display: block; margin-top: 15px; font-weight: bold; }
    input {
      width: 100%;
      padding: 12px;
      margin-top: 7px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 16px;
    }
    button {
      width: 100%;
      padding: 12px;
      margin-top: 14px;
      border: 0;
      border-radius: 8px;
      background: #087f5b;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
    button.secondary { background: #334155; }
    button:disabled { opacity: .6; cursor: wait; }
    #notice { overflow-wrap: anywhere; }
    .small { font-size: 13px; color: #64748b; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main class="card">
    <h1>FakeBank Auth Lab</h1>
    <p class="small">Educational demo only. Not a real bank.</p>

    <section id="authArea">
      <h2 id="formTitle">Create account</h2>

      <form id="passwordForm">
        <label for="email">Email address</label>
        <input id="email" type="email" autocomplete="email" required>

        <div id="passwordFields">
          <label for="password">Password</label>
          <input id="password" type="password"
                 autocomplete="new-password" minlength="8" required>
        </div>

        <button id="passwordButton" type="submit">Create account</button>
      </form>

      <button id="switchButton" class="secondary" type="button">
        Already have an account? Login
      </button>

      <hr style="margin-top:24px">

      <h2>Email OTP Login</h2>
      <p class="small">Receive a one-time code by email.</p>

      <button id="sendOtpButton" type="button">
        Send email OTP
      </button>

      <form id="otpForm" hidden>
        <label for="otp">Email verification code</label>
        <input id="otp" inputmode="numeric" autocomplete="one-time-code"
               maxlength="10" required>
        <button type="submit">Verify OTP and login</button>
      </form>
    </section>

    <section id="accountArea" hidden>
      <h2>You're logged in!</h2>
      <p id="userEmail"></p>
      <p>This is a real Supabase login session, but the banking
         functions are only a practice demo.</p>
      <button id="logoutButton">Logout</button>
    </section>

    <p id="notice" role="status" aria-live="polite"></p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // Replace these two values with your own Supabase project details.
   const SUPABASE_URL = "https://uacmvuopitbvdhstgmap.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_RoaxQq3IUoI6KW2oYm90Ew_ipilaDJs";

    const client = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    const authArea = document.getElementById("authArea");
    const accountArea = document.getElementById("accountArea");
    const passwordForm = document.getElementById("passwordForm");
    const passwordFields = document.getElementById("passwordFields");
    const password = document.getElementById("password");
    const email = document.getElementById("email");
    const notice = document.getElementById("notice");
    const otpForm = document.getElementById("otpForm");

    let loginMode = false;

    function showMessage(message) {
      notice.textContent = message;
    }

    function setBusy(button, busy) {
      button.disabled = busy;
    }

    function showAccount(user) {
      authArea.hidden = true;
      accountArea.hidden = false;
      document.getElementById("userEmail").textContent =
        "Signed in as: " + (user.email || "User");
      showMessage("Authentication successful.");
    }

    async function refreshSession() {
      const { data, error } = await client.auth.getSession();
      if (error) {
        showMessage(error.message);
        return;
      }
      if (data.session) showAccount(data.session.user);
    }

    document.getElementById("switchButton").addEventListener("click", () => {
      loginMode = !loginMode;
      document.getElementById("formTitle").textContent =
        loginMode ? "Login" : "Create account";
      document.getElementById("passwordButton").textContent =
        loginMode ? "Login with password" : "Create account";
      password.autocomplete = loginMode ? "current-password" : "new-password";
      document.getElementById("switchButton").textContent =
        loginMode ? "Need an account? Sign up" :
                    "Already have an account? Login";
      showMessage("");
    });

    passwordForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      const button = document.getElementById("passwordButton");
      setBusy(button, true);
      showMessage("Please wait...");

      try {
        let result;

        if (loginMode) {
          result = await client.auth.signInWithPassword({
            email: email.value.trim(),
            password: password.value
          });
        } else {
          result = await client.auth.signUp({
            email: email.value.trim(),
            password: password.value
          });
        }

        if (result.error) throw result.error;

        if (result.data.session) {
          showAccount(result.data.user);
        } else if (loginMode) {
          showMessage("Login did not create a session. Check your email verification.");
        } else {
          showMessage("Signup received. Check your email to confirm your account.");
        }
      } catch (error) {
        showMessage(error.message || "Something went wrong.");
      } finally {
        setBusy(button, false);
      }
    });

    document.getElementById("sendOtpButton").addEventListener("click",
      async () => {
        const button = document.getElementById("sendOtpButton");

        if (!email.value.trim()) {
          showMessage("Enter your email address first.");
          email.focus();
          return;
        }

        setBusy(button, true);
        showMessage("Sending OTP...");

        try {
          const { error } = await client.auth.signInWithOtp({
            email: email.value.trim(),
            options: { shouldCreateUser: true }
          });

          if (error) throw error;

          otpForm.hidden = false;
          showMessage("If the email can be delivered, check your inbox for the code.");
        } catch (error) {
          showMessage(error.message || "Could not send OTP.");
        } finally {
          setBusy(button, false);
        }
      }
    );

    otpForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      const button = otpForm.querySelector("button[type='submit']");
      setBusy(button, true);
      showMessage("Verifying code...");

      try {
        const { data, error } = await client.auth.verifyOtp({
          email: email.value.trim(),
          token: document.getElementById("otp").value.trim(),
          type: "email"
        });

        if (error) throw error;
        showAccount(data.user);
      } catch (error) {
        showMessage(error.message || "Invalid or expired OTP.");
      } finally {
        setBusy(button, false);
      }
    });

    document.getElementById("logoutButton").addEventListener("click",
      async () => {
        const { error } = await client.auth.signOut();

        if (error) {
          showMessage(error.message);
          return;
        }

        accountArea.hidden = true;
        authArea.hidden = false;
        passwordForm.reset();
        otpForm.reset();
        otpForm.hidden = true;
        showMessage("You have logged out.");
      }
    );

    client.auth.onAuthStateChange((_event, session) => {
      if (session) showAccount(session.user);
    });

    refreshSession();
  </script>
</body>
</html>
